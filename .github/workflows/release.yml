name: Publish GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish tagged release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate tag, plugin version, and release notes
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'v(\d+\.\d+\.\d+)', tag)
          if not match:
              raise SystemExit(f'Unexpected release tag: {tag}')
          version = match.group(1)
          plugin = Path('getmcp-extensions.php').read_text(encoding='utf-8')
          header = re.search(r'^\s*\* Version:\s*(\S+)', plugin, re.M)
          constant = re.search(r"define\(\s*'GETMCP_EXTENSIONS_VERSION',\s*'([^']+)'", plugin)
          readme = Path('readme.txt').read_text(encoding='utf-8')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          if not header or header.group(1) != version:
              raise SystemExit('Tag does not match the plugin header version.')
          if not constant or constant.group(1) != version:
              raise SystemExit('Tag does not match GETMCP_EXTENSIONS_VERSION.')
          if f'Stable tag: {version}' not in readme:
              raise SystemExit('Tag does not match the readme stable tag.')
          lines = changelog.splitlines()
          start = next((i for i, line in enumerate(lines) if re.fullmatch(rf'## {re.escape(version)}(?: - .*)?', line)), None)
          if start is None:
              raise SystemExit('CHANGELOG.md has no heading for this release.')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          section = lines[start:end]
          bullets = [line for line in section if line.startswith('- ')]
          categories = {'NEW', 'IMPROVE', 'FIX', 'SECURITY', 'COMPAT', 'DEPRECATE', 'REMOVE', 'DEV', 'TRANSLATIONS'}
          if not bullets or any(not re.match(r'^- \[(' + '|'.join(categories) + r')\] .+', line) for line in bullets):
              raise SystemExit('Release changelog must contain categorized bullets.')
          notes = '\n'.join(section).strip() + '\n'
          out = Path('dist')
          out.mkdir(exist_ok=True)
          (out / 'release-notes.md').write_text(notes, encoding='utf-8', newline='\n')
          commit = subprocess.check_output(['git', 'rev-parse', f'{tag}^{{commit}}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != head:
              raise SystemExit('Checked-out commit does not match the tagged commit.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          tags = subprocess.check_output(
              ['git', 'tag', '--merged', head, '--sort=-version:refname'], text=True
          ).splitlines()
          prior = []
          newer = []
          for candidate in tags:
              parsed = re.fullmatch(r'v(\d+\.\d+\.\d+)', candidate)
              if parsed:
                  candidate_version = tuple(map(int, parsed.group(1).split('.')))
                  target_version = tuple(map(int, version.split('.')))
                  if candidate_version < target_version:
                      prior.append(candidate)
                  elif candidate_version > target_version:
                      newer.append(candidate)
          if newer:
              raise SystemExit(f'Refusing to publish an older release tag; newer tag exists: {newer[0]}')
          if not prior:
              raise SystemExit('No prior semantic-version tag is available for the developer handoff baseline.')
          base_tag = prior[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'base_tag={base_tag}\n')
          PY

      - name: Build deterministic install package
        run: python tools/build.py

      - name: Build credential-free developer handoff
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          BASE_TAG: ${{ steps.metadata.outputs.base_tag }}
        run: >-
          python tools/build-release-handoff.py
          --version "$RELEASE_VERSION"
          --base-tag "$BASE_TAG"

      - name: Verify release package and generated assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile

          version = os.environ['RELEASE_VERSION']
          root = Path('dist')
          package = root / f'getmcp-extensions-{version}.zip'
          handoff = root / f'getmcp-extensions-{version}-developer-handoff.zip'
          checksums = root / 'SHA256SUMS'
          inventory = root / 'files.json'
          for path in (package, handoff, checksums, inventory, root / 'release-notes.md'):
              if not path.is_file():
                  raise SystemExit(f'Missing release output: {path}')
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          handoff_digest = hashlib.sha256(handoff.read_bytes()).hexdigest()
          expected = f'{digest}  {package.name}\n{handoff_digest}  {handoff.name}\n'
          if checksums.read_text(encoding='utf-8') != expected:
              raise SystemExit('SHA256SUMS does not match the built package.')
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Package CRC verification failed.')
              names = archive.namelist()
              if not names or any(not name.startswith('getmcp-extensions/') for name in names):
                  raise SystemExit('Package must contain a single getmcp-extensions/ root.')
              if f'getmcp-extensions/getmcp-extensions.php' not in names:
                  raise SystemExit('Package main plugin file is missing.')
              if archive.read('getmcp-extensions/DISTRIBUTION').decode().strip() != f'GetMCP Extensions {version}':
                  raise SystemExit('Package distribution version does not match the tag.')
          with zipfile.ZipFile(handoff) as archive:
              if archive.testzip() is not None or 'feature.patch' not in archive.namelist():
                  raise SystemExit('Developer handoff archive is invalid.')
          manifest = json.loads(inventory.read_text(encoding='utf-8'))
          if not isinstance(manifest, dict) or not manifest:
              raise SystemExit('Package file inventory is empty or invalid.')
          print(f'Validated {package.name}: sha256={digest}, entries={len(names)}')
          print(f'Validated {handoff.name}: sha256={handoff_digest}')
          PY

      - name: Create the stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/getmcp-extensions-${RELEASE_VERSION}.zip"
          "dist/getmcp-extensions-${RELEASE_VERSION}-developer-handoff.zip"
          dist/SHA256SUMS
          dist/files.json
          --verify-tag
          --title "GetMCP Extensions ${RELEASE_VERSION}"
          --notes-file dist/release-notes.md
          --latest
